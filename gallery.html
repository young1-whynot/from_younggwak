<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cut">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>갤러리</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000000}
a{color:#4c8dff}a:hover{color:#7aaaff}
button{font-family:inherit}
input{font-family:inherit}
.noscrollbar::-webkit-scrollbar{display:none}
</style>

<style>
html,body{height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
#stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform-origin:center center;transform:translate(-50%,-50%)}
#app{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative}
@media (max-width:500px){#app{border-radius:0}}
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Noto Sans KR', system-ui, sans-serif; background: #000000; color: #ffffff; display: flex; flex-direction: column">
<div style="height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; box-sizing: border-box; color: {{fg}}">
<div style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums"><span style="font-weight: normal">{{clockText}}</span></div>
<div style="display: flex; align-items: center; gap: 6px">
<svg aria-hidden="true" width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
<svg aria-hidden="true" width="17" height="12" viewBox="0 0 24 17" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" style="width: 18px; height: 15px; stroke-width: 0px; border-radius: 300px"><path d="M2.95 7.15L0.54 4.74A16.2 16.2 0 0 1 23.46 4.74L21.05 7.15A12.8 12.8 0 0 0 2.95 7.15Z" stroke-width="0"></path><path d="M6.91 11.11L4.36 8.56A10.8 10.8 0 0 1 19.64 8.56L17.09 11.11A7.2 7.2 0 0 0 6.91 11.11Z" stroke-width="0"></path><path d="M12 16.2L8.32 12.52A5.2 5.2 0 0 1 15.68 12.52Z" stroke-width="0"></path></svg>
<div style="display: flex; align-items: center; gap: 1px; margin-left: -3px"><div style="width: 25px; height: 13px; box-sizing: border-box; border-radius: 4px; overflow: hidden; position: relative; display: flex"><div style="width: 93%; height: 100%; background: #ffffff; opacity: 0.76"></div><div style="flex-grow: 1; height: 100%; background: #d1d1d6; opacity: 0.5"></div><div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; font-size: 10px; font-weight: 700; color: #000000; display: flex; align-items: center; justify-content: center; opacity: 1">93</div></div><div style="width: 2px; height: 5px; border-radius: 1px; background: currentColor"></div></div>
</div>
</div>
<div style="height: 794px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 6px 0 0; gap: 10px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 16px; flex-shrink: 0; position: relative">
<a href="index.html" onClick="{{markBack}}" style="align-self: flex-start; padding: 10px 0; font-size: 16px; color: #3478f6; text-decoration: none">‹ 홈</a>
<h1 style="margin: 0; font-size: 32px; font-weight: 700">보관함</h1>
<div style="font-size: 12px; color: #a1a1a8">{{photoCount}}장의 사진</div>
<div style="font-size: 15px; line-height: 1; position: absolute; left: 339px; top: 11px; color: #4c8dff; width: 39px; height: 16px">선택</div>
</div>
<div class="noscrollbar" style="flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none; display: grid; grid-template-columns: repeat(3, 128px); grid-auto-rows: 128px; gap: 3px; align-content: start; padding-bottom: 34px">
<sc-for list="{{gallery}}" as="g" hint-placeholder-count="12">
<button onClick="{{g.open}}" aria-label="{{g.label}}" style="padding: 0; margin: 0; border: 0; border-radius: 0; background: #1c1c1e; width: 128px; height: 128px; position: relative; overflow: hidden; cursor: pointer; display: block"><img src="{{g.src}}" alt="" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block"></button>
</sc-for>
</div>
</div>
<sc-if value="{{viewing}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000000; display: flex; flex-direction: column; z-index: 5">
<div style="height: 50px"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
<button onClick="{{closeView}}" style="border: 0; background: none; padding: 10px 4px; font-size: 16px; color: #3478f6; cursor: pointer">‹ 보관함</button>
<div style="font-size: 14px; color: #a1a1a8">{{viewPos}}</div>
<span style="width: 70px"></span>
</div>
<div style="flex-grow: 1; min-height: 0; display: flex; align-items: center; justify-content: center"><img src="{{viewSrc}}" alt="선택한 사진" style="max-width: 100%; max-height: 100%; object-fit: contain; display: block"></div>
<div style="display: flex; justify-content: space-between; padding: 10px 24px 40px">
<button onClick="{{prevView}}" aria-label="이전 사진" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: #1c1c1e; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button onClick="{{nextView}}" aria-label="다음 사진" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: #1c1c1e; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
</sc-if>
<a href="index.html" onClick="{{markBack}}" aria-label="홈으로" style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 160px; height: 26px; display: flex; align-items: center; justify-content: center; z-index: 6"><span style="width: 134px; height: 5px; border-radius: 3px; background: #d0d0d4"></span></a>
</div>
</template>
<script src="lib/preact.min.js"></script>
<script src="lib/dc-runtime.js"></script>
<script>

const PHOTOS = ['assets/d58f341ed1c52c3b3482c001b1944f2b.png', 'assets/6993c4dd35b8d41dacbaed2d33e0ea35.png', 'assets/cd951ae1efff4cc13a4a4315f3871d12.png', 'assets/eb05469e6d755d4996d124b2373140b8.png', 'assets/ea485c7903a451989831392dccc94185.png', 'assets/37e89b7ade63aeaa70db45ea50d5e4ed.png', 'assets/6ad56dbd6832c54991e5b290cadeb08f.png', 'assets/35dcdf9f041e3020df78237294448483.png', 'assets/c9d734b31126e9dde24792350f12c968.png', 'assets/57e0983dc716c2a7e125af9db6bf3407.png', 'assets/eb294c0ed50ac602e3e2e84b53e00bec.png', 'assets/67134620ec4ebddd1eeb054ed2a98ec6.png', 'assets/52361febd4ca2bb5d5acdc87ca908f6a.jpg', 'assets/30aecdde710afbffb77a0bd6e3a32fe3.png', 'assets/af2d81242f82f533d07e11476b3e49e9.png', 'assets/b512ef1ae0a72a9829767713512cf2e5.png', 'assets/51bb0b526c75bf10c34a3ad691af5590.png', 'assets/36d8087bb8c8c20ed2cc2867edc6f0d4.png', 'assets/39c3d0413c001dc09e84b7dea4c95705.png', 'assets/39a9b9baaa044ccfaf0c91cfb50f030a.png', 'assets/519f18b9beb8f6d37ca2351c69c3e439.png', 'assets/cf38b54505be59be34e6ba2cf71c1e80.png', 'assets/288aeb45406a2c6fb942d0aed5a8f530.png', 'assets/6e73ece33ff3570444cb9c43b51a265d.png', 'assets/9c02515bb776b4d0bdf1bda44dd56da3.png', 'assets/895b6434df2dc5a23814ba6e1a094625.png', 'assets/2a40acaff109e9e331a0620aa0882c5f.png'];
const THUMBS = ['assets/225cd95af8050bfa4381f519fa87602e.jpg', 'assets/2f4087f81deb0e7e783c1b723955dc08.jpg', 'assets/c9429a296d5f1ceaaed3577ed8d2168c.jpg', 'assets/ba9ed04f4ef0fa1c3d61177b02fff2b5.jpg', 'assets/9cd7f377321c6872e2a5967ae52db3c6.jpg', 'assets/df8968b6b6c93dd71b58ec1fa899a9f7.jpg', 'assets/830a44c8f28426af683d7038c845c7d7.jpg', 'assets/369593a213f588b521298b32e2ee45e0.jpg', 'assets/8f818661286ef54d1bc64bf28e13fc5b.jpg', 'assets/083d8f32132b3938917d0c40334430ae.jpg', 'assets/78dcd0e0f2ec2f641c336fb294b5a14c.jpg', 'assets/704988e3e10bef1a8a22e74424d48433.jpg', 'assets/90226bdefea6eb8ca5cc774704797dd8.jpg', 'assets/cd193fff24de596b089d5b63ee0cb07a.jpg', 'assets/caa6e6e5e4f7fa508f6e4ededcfcd055.jpg', 'assets/2dd36df5829941b40e312f4388fd96fa.jpg', 'assets/559b83d75103af618f943dadfca97a44.jpg', 'assets/460dab70a65dda08477f80b2ab533c05.jpg', 'assets/5833f94360a2bcf42c16c7c65e6a4009.jpg', 'assets/08cd29c02c04c5c7d5007d798f212a81.jpg', 'assets/fe38f2caa8fca4d6e1973696973b6552.jpg', 'assets/2fcd8b4e75733501b45f413ce1004402.jpg', 'assets/fc174b6cc24e78602fcfe0663db04700.jpg', 'assets/d59cf1d36c17fbaa4308e792d717df13.jpg', 'assets/33ba61a801aa53a8fb06e54a8db2e153.jpg', 'assets/c3504b033ed71d861af3f022400bead0.jpg', 'assets/a239554086dcc7942285b196922064e7.jpg'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { viewIdx: -1, now: Date.now() };
  }
  componentDidMount() {
    this.iv = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.iv);
  }
  renderVals() {
    const s = this.state;
    const now = new Date(s.now);
    const h = now.getHours(), mi = now.getMinutes();
    const n = PHOTOS.length;
    return {
      fg: '#ffffff',
      markBack: () => { try { sessionStorage.setItem('fromGallery', '1'); } catch (e) {} },
      clockText: String(h % 12 || 12).padStart(2, '0') + ':' + String(mi).padStart(2, '0'),
      photoCount: n,
      gallery: PHOTOS.map((src, i) => ({ src: THUMBS[i] || src, label: '사진 ' + (i + 1), open: () => this.setState({ viewIdx: i }) })),
      viewing: s.viewIdx >= 0,
      viewSrc: s.viewIdx >= 0 ? PHOTOS[s.viewIdx] : '',
      viewPos: (s.viewIdx + 1) + ' / ' + n,
      closeView: () => this.setState({ viewIdx: -1 }),
      prevView: () => this.setState({ viewIdx: (s.viewIdx + n - 1) % n }),
      nextView: () => this.setState({ viewIdx: (s.viewIdx + 1) % n })
    };
  }
}

DCMount(Component, {});
</script>
</body>
</html>
