<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cut">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>폰 UI 프로토타입</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000000}
a{color:#4c8dff}a:hover{color:#7aaaff}
button{font-family:inherit}
input{font-family:inherit}
.noscrollbar::-webkit-scrollbar{display:none}
@keyframes capIn{from{opacity:0}to{opacity:1}}
@keyframes capOut{from{opacity:1}to{opacity:0}}
@keyframes passShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
</style>

<style>
html,body{height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
#stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform-origin:center center;transform:translate(-50%,-50%)}
#app{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative}
@media (max-width:500px){#app{border-radius:0}}
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Noto Sans KR', system-ui, sans-serif; background: {{bg}}; color: {{fg}}; display: flex; flex-direction: column; isolation: isolate">
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<img src="assets/824d9332d0c34acbd23bc27b45334570.png" alt="" aria-hidden="true" style="position: absolute; left: -9px; top: -26px; width: 459px; height: 863px; object-fit: cover; z-index: -1; pointer-events: none">
<div aria-hidden="true" style="position: absolute; left: -9px; top: -39px; width: 433px; height: 872px; background: rgba(0,0,0,0.18); z-index: -1; pointer-events: none"></div>
</sc-if>

<div style="height: 50px; flex-shrink: 0; position: relative; z-index: 60; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; box-sizing: border-box; color: {{fg}}">
<div style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums"><span style="font-weight: normal">{{clockText}}</span></div>
<div style="display: flex; align-items: center; gap: 6px">
<svg aria-hidden="true" width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
<svg aria-hidden="true" width="17" height="12" viewBox="0 0 24 17" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" style="width: 18px; height: 15px; stroke-width: 0px; border-radius: 300px"><path d="M2.95 7.15L0.54 4.74A16.2 16.2 0 0 1 23.46 4.74L21.05 7.15A12.8 12.8 0 0 0 2.95 7.15Z" stroke-width="0"></path><path d="M6.91 11.11L4.36 8.56A10.8 10.8 0 0 1 19.64 8.56L17.09 11.11A7.2 7.2 0 0 0 6.91 11.11Z" stroke-width="0"></path><path d="M12 16.2L8.32 12.52A5.2 5.2 0 0 1 15.68 12.52Z" stroke-width="0"></path></svg>
<div style="display: flex; align-items: center; gap: 1px; margin-left: -3px"><div style="width: 25px; height: 13px; box-sizing: border-box; border-radius: 4px; overflow: hidden; position: relative; display: flex"><div style="width: 93%; height: 100%; background: #ffffff; opacity: 0.76"></div><div style="flex-grow: 1; height: 100%; background: #d1d1d6; opacity: 0.5"></div><div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; font-size: 10px; font-weight: 700; color: #000000; display: flex; align-items: center; justify-content: center; opacity: 1">93</div></div><div style="width: 2px; height: 5px; border-radius: 1px; background: currentColor"></div></div>
</div>
</div>

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; padding: 18px 20px 0; gap: 22px; position: relative">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<button onClick="{{openWeather}}" aria-label="날씨 위젯" style="width: 100%; height: 162px; border: 0; border-radius: 22px; background: #262b4f; color: #ffffff; padding: 16px 16px; box-sizing: border-box; text-align: left; display: flex; flex-direction: column; cursor: pointer">
<span style="font-size: 15px; font-weight: 700">서울</span>
<span style="font-size: 44px; font-weight: 400; line-height: 1.1; margin-top: 8px">15°</span>
<span style="font-size: 12px; font-weight: 500; margin-top: auto">대체로 흐림</span>
<span style="font-size: 12px; font-weight: 500; margin-top: 2px">최고:21° 최저:12°</span>
</button>
<span style="font-size: 12px; color: #ffffff">날씨</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<a href="gallery.html" aria-label="사진 위젯, 갤러리 열기" style="text-decoration: none; box-sizing: border-box; width: 100%; height: 162px; padding: 0; border: 0; border-radius: 22px; overflow: hidden; background: #2c2c2e; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative">
<img src="assets/67134620ec4ebddd1eeb054ed2a98ec6.png" alt="꽃다발 사진" style="width: 100%; height: 100%; object-fit: cover; display: block">
</a>
<span style="font-size: 12px; color: #ffffff">사진</span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 10px; padding: 0 6px; position: relative">
<button onClick="{{openNotes}}" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #ffffff">
<span style="width: 62px; height: 62px; border-radius: 15px; background: #fbf6e6; overflow: hidden; display: flex; flex-direction: column">
<span style="height: 18px; background: #f2b632"></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 7px; padding: 0 9px"><span style="height: 2px; background: #d9d3c2"></span><span style="height: 2px; background: #d9d3c2"></span><span style="height: 2px; width: 60%; background: #d9d3c2"></span></span>
</span>
<span style="font-size: 12px">메모</span>
</button>
<button onClick="{{openCal}}" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #ffffff">
<span style="width: 62px; height: 62px; border-radius: 15px; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 10px; font-weight: 500; color: #e5332a; line-height: 1">{{weekdayLong}}</span>
<span style="font-size: 30px; font-weight: 400; color: #111111; line-height: 1.1">{{dayNum}}</span>
</span>
<span style="font-size: 12px">캘린더</span>
</button>
<button onClick="{{openDday}}" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #ffffff">
<span style="width: 62px; height: 62px; border-radius: 15px; background: #f1eef3; display: flex; align-items: center; justify-content: center">
<span style="width: 38px; height: 34px; border-radius: 8px; background: #ffffff; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.15)">
<span style="height: 9px; background: #e8505b"></span>
<span style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #e8505b">D-</span>
</span>
</span>
<span style="font-size: 12px">디데이</span>
</button>
<a href="https://www.youtube.com/watch?v=YnY5M5EBiYA&amp;list=PLZ5Z9Bcc8Spn-uXFYvX8KQDUU_uLqoIII&amp;index=11" target="_blank" rel="noopener" style="text-decoration: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #ffffff; position: relative">
<span style="width: 60px; height: 58px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background-color: #FE0D38"></span>
<span style="font-size: 12px">음악</span>
<span style="position: absolute; left: 6px; top: -3px; width: 64px; height: 65px; overflow: hidden; pointer-events: none"><img src="assets/793b5b56a420aa5a894918ba06f49b33.png" alt="" style="position: absolute; left: -60.3px; top: -17.4px; width: 185.1px; height: 97.2px; max-width: none; display: block"></span></a>
<button onClick="{{openTimer}}" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #ffffff">
<span style="width: 62px; height: 62px; border-radius: 15px; background: #111111; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="25" fill="#ffffff"></circle><g stroke="#111111" stroke-width="2" stroke-linecap="round"><path d="M26 4v4M26 44v4M4 26h4M44 26h4"></path><path d="M26 26L26 13" transform="{{hourRot}}"></path><path d="M26 26L26 9" stroke-width="1.5" transform="{{minRot}}"></path></g><path d="M26 29L26 7" stroke="#f08a24" stroke-width="1" transform="{{secRot}}"></path><circle cx="26" cy="26" r="1.8" fill="#f08a24"></circle></svg>
</span>
<span style="font-size: 12px">시계</span>
</button>
<button onClick="{{openWeather}}" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #ffffff">
<span style="width: 62px; height: 62px; border-radius: 15px; background: #3f8ee8; display: flex; align-items: center; justify-content: center; position: relative">
<span style="position: absolute; left: 12px; top: 12px; width: 22px; height: 22px; border-radius: 11px; background: #ffd23f"></span>
<span style="position: absolute; left: 18px; top: 26px; width: 32px; height: 18px; border-radius: 9px; background: #ffffff"></span>
</span>
<span style="font-size: 12px">날씨</span>
</button>
<button onClick="{{openTalk}}" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #ffffff; position: relative">
<span style="width: 59px; height: 60px; border-radius: 15px; background: #fee500; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; color: #3c1e1e; font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px">K</span>
<sc-if value="{{talkBadgeOn}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #ff3b30; color: #ffffff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{talkBadge}}</span></sc-if>
<span style="font-size: 12px">톡</span>
</button>
<button onClick="{{openGram}}" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #ffffff; position: relative">
<span style="width: 62px; height: 62px; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; background-color: #ffffff"></span>
<span style="font-size: 12px">Instagram</span>
<img src="assets/e4ef183fbf45b168741f5fc1d7389aab.png" alt="Pasted image" width="866" height="866" style="position: absolute; left: 6px; top: 0px; width: 64px; height: 62px"></button>
</div>
</div>

<div style="margin: 0 10px 30px; padding: 14px 12px; border-radius: 34px; display: flex; justify-content: space-around; align-items: center; position: relative; background-color: #686868BD">
<button onClick="{{openPhone}}" aria-label="전화" style="width: 66px; height: 66px; padding: 0; border: 0; border-radius: 15px; background: #ffffff; cursor: pointer; flex-shrink: 0; position: relative"><img src="assets/17c847f028f6c07cc05f13b01a9d7b8f.png" alt="" style="width: 78px; height: 75px; display: block; object-fit: cover; position: absolute; left: -6px; top: -4.5px; pointer-events: none"></button>
<button onClick="{{openMsg}}" aria-label="문자" style="width: 66px; height: 66px; padding: 0; border: 0; border-radius: 15px; overflow: hidden; background: #ffffff; cursor: pointer; flex-shrink: 0"><img src="assets/69947634948e81fe0508465e12d9a922.png" alt="" style="width: 66px; height: 66px; display: block; object-fit: cover"></button>
<button onClick="{{openWeb}}" aria-label="인터넷" style="width: 66px; height: 66px; padding: 0; border: 0; border-radius: 15px; overflow: hidden; background: #ffffff; cursor: pointer; flex-shrink: 0"><img src="assets/db0d73f8bad39e8c54dcc8444b45b2dd.png" alt="" style="width: 66px; height: 66px; display: block; object-fit: cover"></button>
<a href="gallery.html" aria-label="갤러리" style="box-sizing: border-box; width: 66px; height: 66px; padding: 0; border: 0; border-radius: 15px; overflow: hidden; background: #ffffff; cursor: pointer; flex-shrink: 0"><img src="assets/7d16e3ae507993b157d467296bbcda39.png" alt="" style="width: 66px; height: 66px; display: block; object-fit: cover"></a>
</div>
</sc-if>

<sc-if value="{{isNotes}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; padding: 6px 20px 0; gap: 16px; min-height: 0">
<button onClick="{{goHome}}" style="align-self: flex-start; border: 0; background: none; padding: 10px 0; font-size: 16px; color: {{accent}}; cursor: pointer">‹ 홈</button>
<h1 style="margin: 0; font-size: 32px; font-weight: 700">메모</h1>
<div style="display: flex; gap: 8px">
<label for="noteInput" style="position: absolute; left: -9999px">새 메모</label>
<input id="noteInput" value="{{draft}}" onChange="{{onDraft}}" placeholder="새 메모 입력" style="flex-grow: 1; height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid {{line}}; background: {{card}}; color: {{fg}}; font-size: 15px">
<button onClick="{{addNote}}" style="height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: {{accent}}; color: #ffffff; font-size: 15px; font-weight: 500; cursor: pointer">추가</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-bottom: 20px">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: {{card}}">
<div style="flex-grow: 1; font-size: 15px; line-height: 1.4">{{n.text}}</div>
<button onClick="{{n.remove}}" aria-label="메모 삭제" style="width: 44px; height: 44px; border: 0; background: none; color: {{muted}}; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isCal}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; padding: 6px 20px 0; gap: 16px">
<button onClick="{{goHome}}" style="align-self: flex-start; border: 0; background: none; padding: 10px 0; font-size: 16px; color: #ff453a; cursor: pointer">‹ 홈</button>
<h1 style="margin: 0; font-size: 32px; font-weight: 700">{{monthTitle}}</h1>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px 0; text-align: center">
<sc-for list="{{weekHead}}" as="w" hint-placeholder-count="7">
<div style="font-size: 12px; color: {{muted}}; padding-bottom: 6px">{{w}}</div>
</sc-for>
<sc-for list="{{calCells}}" as="c" hint-placeholder-count="35">
<div style="height: 44px; display: flex; align-items: center; justify-content: center"><span style="width: 36px; height: 36px; border-radius: 18px; background: {{c.bg}}; color: {{c.color}}; font-size: 17px; font-weight: {{c.weight}}; display: flex; align-items: center; justify-content: center">{{c.label}}</span></div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isDday}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; padding: 6px 20px 0; gap: 16px">
<button onClick="{{goHome}}" style="align-self: flex-start; border: 0; background: none; padding: 10px 0; font-size: 16px; color: #e8505b; cursor: pointer">‹ 홈</button>
<h1 style="margin: 0; font-size: 32px; font-weight: 700">디데이</h1>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 14px; background: {{card}}">
<label for="ddTitle" style="font-size: 13px; color: {{muted}}">이름</label>
<input id="ddTitle" value="{{ddTitle}}" onChange="{{onDdTitle}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid {{line}}; background: {{bg}}; color: {{fg}}; font-size: 15px">
<label for="ddDate" style="font-size: 13px; color: {{muted}}; margin-top: 6px">날짜</label>
<input id="ddDate" type="date" value="{{ddDate}}" onChange="{{onDdDate}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid {{line}}; background: {{bg}}; color: {{fg}}; font-size: 15px; color-scheme: {{scheme}}">
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 30px">
<div style="font-size: 16px; color: {{muted}}">{{ddTitle}}</div>
<div style="font-size: 64px; font-weight: 700; color: #e8505b">{{ddText}}</div>
</div>
</div>
</sc-if>

<sc-if value="{{isWeather}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; padding: 6px 20px 0; gap: 10px; background: #262b4f; color: #ffffff; margin-top: -50px; padding-top: 56px">
<button onClick="{{goHome}}" style="align-self: flex-start; border: 0; background: none; padding: 10px 0; font-size: 16px; color: #ffffff; cursor: pointer">‹ 홈</button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 30px">
<div style="font-size: 32px">서울</div>
<div style="font-size: 96px; font-weight: 300; line-height: 1">15°</div>
<div style="font-size: 18px">대체로 흐림</div>
<div style="font-size: 18px">최고:21° 최저:12°</div>
</div>
<div style="margin-top: 30px; padding: 14px; border-radius: 16px; background: #343a63; display: flex; justify-content: space-between">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px"><span>{{h.t}}</span><span style="font-weight: 500">{{h.v}}</span></div>
</sc-for>
</div>
</div>
</sc-if>



<sc-if value="{{isTimer}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; padding: 6px 20px 0; gap: 16px">
<button onClick="{{goHome}}" style="align-self: flex-start; border: 0; background: none; padding: 10px 0; font-size: 16px; color: #f08a24; cursor: pointer">‹ 홈</button>
<h1 style="margin: 0; font-size: 32px; font-weight: 700">스톱워치</h1>
<div style="display: flex; flex-direction: column; align-items: center; gap: 40px; padding-top: 60px">
<div style="font-size: 76px; font-weight: 300; letter-spacing: 1px; font-variant-numeric: tabular-nums">{{timeText}}</div>
<div style="display: flex; gap: 40px">
<button onClick="{{resetTimer}}" style="width: 84px; height: 84px; border-radius: 42px; border: 0; background: {{card}}; color: {{fg}}; font-size: 16px; cursor: pointer">초기화</button>
<button onClick="{{toggleTimer}}" style="width: 84px; height: 84px; border-radius: 42px; border: 0; background: {{runBg}}; color: #ffffff; font-size: 16px; font-weight: 500; cursor: pointer">{{runLabel}}</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isSettings}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; padding: 6px 20px 0; gap: 16px">
<button onClick="{{goHome}}" style="align-self: flex-start; border: 0; background: none; padding: 10px 0; font-size: 16px; color: {{accent}}; cursor: pointer">‹ 홈</button>
<h1 style="margin: 0; font-size: 32px; font-weight: 700">설정</h1>
<div style="display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: {{card}}">
<button onClick="{{toggleDark}}" role="switch" aria-checked="{{darkStr}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; border: 0; border-bottom: 1px solid {{line}}; background: none; color: {{fg}}; font-size: 15px; cursor: pointer">
<span>다크 모드</span>
<span style="width: 51px; height: 31px; border-radius: 16px; background: {{switchBg}}; display: flex; align-items: center; padding: 2px; box-sizing: border-box; justify-content: {{switchPos}}"><span style="width: 27px; height: 27px; border-radius: 14px; background: #ffffff"></span></span>
</button>
<button onClick="{{cycleAccent}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; border: 0; background: none; color: {{fg}}; font-size: 15px; cursor: pointer">
<span>강조 색상</span>
<span style="display: flex; align-items: center; gap: 8px; color: {{muted}}">{{accentName}}<span style="width: 22px; height: 22px; border-radius: 11px; background: {{accent}}"></span></span>
</button>
</div>
<div style="font-size: 13px; color: {{muted}}; padding: 0 4px">홈 화면은 항상 검은 배경이에요. 다크 모드는 앱 화면에 적용돼요.</div>
</div>
</sc-if>

<sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
<div style="height: 794px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 0 30px; background: #000000; color: #ffffff">
